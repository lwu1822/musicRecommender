---
layout: custom
---

<html>
<head>
  <title>ChatGPT Recommendation</title>
</head>
<link rel="stylesheet" href="{{ site.baseurl }}/frontend/index.min.css" />
<body>
  <h1>ChatGPT Recommendation</h1>

  <div class="as">
    <div class="tooltip">
      <a href="{{ site.baseurl }}/frontend/songrecinput.html" class="a1">Song</a>
      <div class="bottom">Input Songs</div>
    </div>
    <div class="tooltip">
      <a href="{{ site.baseurl }}/frontend/chatgptapi.html" class="a4">Chat GPT</a>
      <div class="bottom">Ask Chat GPT for song recommendations</div>
    </div>
    <div class="tooltip">
      <a href="{{ site.baseurl }}/frontend/login.html" class="a6">Login</a>
    </div>
  </div>

  <form id="userInputForm">
    <label for="userInput">Enter your music preference:</label>
    <input type="text" id="userInput" required>
    <button type="submit" id="submitButton">Submit</button>
  </form>

  <div id="outputContainer"></div>

  <script>
    const userInputForm = document.getElementById('userInputForm');
    const userInput = document.getElementById('userInput');
    const outputContainer = document.getElementById('outputContainer');
    const submitButton = document.getElementById('submitButton');

    userInputForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userPrompt = userInput.value;
      userInput.value = '';
      
      submitButton.disabled = true;
      outputContainer.innerHTML = '<p>Getting recommendations...</p>';

      try {
        const response = await fetch('https://musicrecback.duckdns.org/api/users/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ prompt: userPrompt }),
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        displayAssistantReply(data.reply);

      } catch (error) {
        console.error('Error fetching recommendation:', error);
        displayAssistantReply('Sorry, an error occurred while processing your request.');
      } finally {
        submitButton.disabled = false;
      }
    });

    function displayAssistantReply(reply) {
      const replyElement = document.createElement('p');
      replyElement.textContent = reply;
      
      outputContainer.innerHTML = '';
      outputContainer.appendChild(replyElement);
    }
  </script>
</body>
</html>
